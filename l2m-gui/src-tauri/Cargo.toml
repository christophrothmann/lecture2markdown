[package]
name = "l2m-gui"
version = "1.3.6"
description = "Lecture2Markdown Desktop GUI"
authors = ["Lecture2Markdown Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = "0.3.34"
sha2 = "0.11.0"
image = { version = "0.25.10", features = ["png", "jpeg", "webp"] }
pdfium-render = "0.9.3"
async-trait = "0.1.92"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
base64 = "0.23.1"
rand = "0.10.2"
lopdf = "0.44.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
