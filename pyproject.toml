[project]
name = "lecture2markdown"
version = "0.4.4"
description = "Convert academic PDF lecture slides into structured Markdown using OpenAI Vision API & Hybrid Routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.52.0",
    "pymupdf>=1.28.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
]

[tool.uv]
package = false
