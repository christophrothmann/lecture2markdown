[project]
name = "lecture2markdown"
version = "1.3.2"
description = "Convert academic PDF lecture slides into structured Markdown using OpenAI Vision API & Hybrid Routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-genai>=0.1.0",
    "mistralai>=1.5.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
]

[tool.uv]
package = false
