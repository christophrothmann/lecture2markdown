name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  python-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create Virtual Environment & Install Dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Code Security Scan (Bandit)
        run: |
          uvx bandit -r lecture2md.py

      - name: Dependency Security Audit (pip-audit)
        run: |
          uvx pip-audit

      - name: Verify Python Code Integrity
        run: |
          uv run python -m py_compile lecture2md.py

  rust-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install cargo-audit binary
        uses: taiki-e/install-action@cargo-audit

      - name: Run RustSec Security Audit
        run: |
          cd l2m-gui/src-tauri
          cargo audit

  build-tauri-gui:
    needs: [python-security-checks, rust-security-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd l2m-gui
          bun install

      - name: Build Tauri Desktop App (.msi / .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './l2m-gui'
          tagName: ${{ github.ref_name }}
          releaseName: 'Lecture2Markdown ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: false
          prerelease: false
