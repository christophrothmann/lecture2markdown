name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  python-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create Virtual Environment & Install Dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Code Security Scan (Bandit)
        run: |
          uvx bandit -r lecture2md.py l2m_core/

      - name: Dependency Security Audit (pip-audit)
        run: |
          uvx pip-audit

      - name: Verify Python Code Integrity
        run: |
          uv run python -m py_compile lecture2md.py

  rust-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install cargo-audit binary
        uses: taiki-e/install-action@cargo-audit

      - name: Run RustSec Security Audit
        run: |
          cd l2m-gui/src-tauri
          cargo audit --ignore RUSTSEC-2024-0429

  build-tauri-gui:
    needs: [python-security-checks, rust-security-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './l2m-gui/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd l2m-gui
          bun install

      - name: Run Frontend Unit Tests
        run: |
          cd l2m-gui
          bun test

      - name: Extract Release Notes from CHANGELOG.md
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          python3 -c "
          import re
          version = '${VERSION}'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n([\s\S]*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content)
          notes = match.group(1).strip() if match else 'See CHANGELOG.md for release details.'
          with open('release_notes.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Tauri Desktop App (.msi / .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './l2m-gui'
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Lecture2Markdown ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
